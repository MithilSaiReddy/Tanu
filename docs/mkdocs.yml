site_name: Tanu
site_description: Desktop AI assistant — Pygame + Tanu
repo_url: https://github.com/MithilSaiReddy/Tanu
edit_uri: edit/main/docs/content/
docs_dir: content
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - toc.integrate
    - content.code.copy
  palette:
    primary: indigo
    accent: teal
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Configuration: getting-started/configuration.md
    - Quick Start: getting-started/quickstart.md
  - Architecture:
    - Overview: architecture/overview.md
    - Components: architecture/components.md
    - Data Flow: architecture/data-flow.md
  - Guide:
    - Server API: guide/server-api.md
    - Gmail Integration: guide/gmail-integration.md
    - Tool System: guide/tool-system.md
    - SBC Panel Mode: guide/sbc-panel.md
  - Development:
    - Setup: development/setup.md
    - Building: development/building.md
    - Contributing: development/contributing.md
