[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tanu"
version = "2.1.0"
description = "Local-first desktop AI assistant with tools and voice"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [
    {name = "Mithil Reddy", email = "mithilsaireddy@gmail.com"}
]
keywords = ["voice", "assistant", "deskbot", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests",
    "aiohttp",
    "sounddevice",
    "piper-tts",
    "psutil>=5.9",
]

[project.optional-dependencies]
voice = [
    "webrtcvad",
]
wakeword = [
    "openwakeword",
]
notify = [
    "plyer",
]
gmail = [
    "google-auth",
    "google-auth-oauthlib",
    "google-api-python-client",
]
discord = [
    "discord.py",
]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
tanu = "tanu.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tanu = ["assets/**/*"]

[project.urls]
Homepage = "https://github.com/MithilSaiReddy/Tanu"
Repository = "https://github.com/MithilSaiReddy/Tanu"
