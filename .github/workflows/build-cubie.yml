name: Build for Radxa Cubie A7Z

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble package
        run: |
          PACKAGE="build/tanu-cubie"
          mkdir -p "$PACKAGE"

          cp main.py "$PACKAGE/"
          cp requirements.txt "$PACKAGE/"
          cp pyproject.toml "$PACKAGE/"
          cp README.md "$PACKAGE/"

          mkdir -p "$PACKAGE/scripts" "$PACKAGE/src"
          cp scripts/launch.sh "$PACKAGE/scripts/"
          cp scripts/first-boot.sh "$PACKAGE/scripts/"
          cp -r src/tanu "$PACKAGE/src/"

          find "$PACKAGE" -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find "$PACKAGE" -name "*.pyc" -delete 2>/dev/null || true

          chmod +x "$PACKAGE/scripts/"*.sh
          tar czf build/tanu-cubie.tar.gz -C build tanu-cubie

          echo "=== Package contents ==="
          ls -lhR "$PACKAGE" | head -40
          echo ""
          echo "=== Tarball ==="
          ls -lh build/tanu-cubie.tar.gz

      - name: Syntax check bundled source
        run: |
          python3 -m compileall -q src/tanu main.py

      - uses: actions/upload-artifact@v4
        with:
          name: tanu-cubie-arm64
          path: build/tanu-cubie.tar.gz
